
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonial Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <article class="testimonial-card">

      <div class="stars" aria-label="5 de 5 estrellas">
        ★★★★★
      </div>

      <h2>Una experiencia increíble</h2>

      <p class="testimonial-text">
        El servicio superó mis expectativas.
        Todo fue sencillo, rápido y profesional.
        Sin duda, lo recomendaría a cualquiera.
      </p>

      <div class="divider"></div>

      <div class="user">
        <img
          src="https://i.pravatar.cc/100?img=12"
          alt="Foto de Lucas Martínez"
          class="avatar"
        >

        <div class="user-info">
          <h3>Lucas Martínez</h3>
          <span>Cliente verificado</span>
        </div>

        <span class="verified" aria-label="Verificado">✓</span>
      </div>

    </article>
  </main>

</body>
</html>
