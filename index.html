
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <meta name="description" content="Un pequeño jardín de flores celestes hecho especialmente para ti.">
  <title>Un pequeño jardín para ti</title>

  <style>
    :root {
      --background: #080b14;
      --background-light: #11182a;
      --blue: #8fc8ff;
      --blue-light: #c5e5ff;
      --text: #e0eaff;
      --text-muted: #a4bdd8;

      --violet: #8b5cf6;
      --violet-light: #c4b5fd;
      --violet-dark: #5b3b9e;

      --cream: #211735;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--background);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* PANTALLAS */

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* PANTALLA INICIAL */

    #intro {
      background:
        radial-gradient(
          ellipse at 50% 38%,
          #22203b 0%,
          #111321 48%,
          #080b14 100%
        );
    }

    .intro-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 24px;
      text-align: center;
      animation: appear 1.2s ease both;
    }

    .envelope {
      position: relative;
      width: min(78vw, 320px);
      height: 205px;
      cursor: pointer;
      perspective: 1000px;
      filter: drop-shadow(0 14px 25px #00000045);
      transition: transform 0.3s ease;
    }

    .envelope:active {
      transform: scale(0.98);
    }

    .env-back {
      position: absolute;
      inset: 0;
      border-radius: 5px;
      background: #6541a5;
      border: 1px solid #9b7ae0;
    }

    .env-front {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #8b5cf6;
      clip-path: polygon(
        0 0,
        50% 58%,
        100% 0,
        100% 100%,
        0 100%
      );
      border-radius: 5px;
      z-index: 3;
    }

    .env-left,
    .env-right {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .env-left {
      background: #7750c7;
      clip-path: polygon(0 0, 50% 58%, 0 100%);
    }

    .env-right {
      background: #6844b4;
      clip-path: polygon(100% 0, 50% 58%, 100% 100%);
    }

    .env-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60%;
      z-index: 4;
      transform-origin: top center;
      background: #a78bfa;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transition:
        transform 0.8s ease,
        z-index 0s 0.4s;
      border-top: 1px solid #c4b5fd;
      backface-visibility: visible;
    }

    .seal {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      background: #6d45bb;
      border: 1px solid #c4b5fd;
      box-shadow: 0 3px 12px #35205c35;
      font-size: 22px;
      transition: opacity 0.3s;
    }

    .letter {
      position: absolute;
      z-index: 1;
      left: 7%;
      width: 86%;
      height: 82%;
      top: 8%;
      padding: 22px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #f8f3ff;
      color: #7651b5;
      font-style: italic;
      border-radius: 3px;
      transition: transform 1s ease;
    }

    .envelope.open .env-flap {
      transform: rotateX(180deg);
      z-index: 0;
    }

    .envelope.open .seal {
      opacity: 0;
    }

    .envelope.open .letter {
      transform: translateY(-80px);
    }

    .intro-title {
      font-size: clamp(23px, 6vw, 32px);
      font-weight: normal;
      letter-spacing: 0.3px;
      color: #d8c8ff;
    }

    .intro-subtitle {
      max-width: 270px;
      font-size: 15px;
      line-height: 1.8;
      color: #b6a8d8;
      font-style: italic;
    }

    .hint {
      margin-top: 3px;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 9px;
      color: #a78bfa;
      animation: breathe 2.5s infinite;
    }

    /* JARDÍN DE FLORES */

    #garden {
      background:
        radial-gradient(
          ellipse at 50% 42%,
          #192238 0%,
          #0d1424 48%,
          #080b14 100%
        );
      cursor: pointer;
      touch-action: manipulation;
    }

    #flower-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* FLORES */

    .flower {
      position: absolute;
      width: var(--size, 46px);
      height: calc(var(--size, 46px) * 1.7);
      transform-origin: 50% 100%;
      animation: grow 0.8s cubic-bezier(.2, .8, .3, 1) both;
      filter: drop-shadow(0 0 5px #8fc8ff25);
    }

    .flower .stem {
      position: absolute;
      top: 32%;
      left: 48%;
      width: 2px;
      height: 65%;
      border-radius: 100%;
      background: linear-gradient(#85bb88, #b2d6a7);
      transform: rotate(var(--lean, 8deg));
      transform-origin: top;
    }

    .flower .leaf {
      position: absolute;
      top: 57%;
      left: 48%;
      width: 34%;
      height: 12%;
      border-radius: 100% 0 100% 0;
      background: #78ad83;
      transform: rotate(-30deg);
    }

    .flower .leaf.second {
      top: 70%;
      left: 28%;
      transform: rotate(40deg) scaleX(-1);
    }

    .flower .head {
      position: absolute;
      top: 0;
      left: 50%;
      width: 62%;
      aspect-ratio: 1;
      transform: translateX(-50%);
    }

    .flower .petal {
      position: absolute;
      width: 43%;
      height: 43%;
      left: 28.5%;
      top: 28.5%;
      border-radius: 50%;
      background: #8fc2ed;
      border: 1px solid #b3d8f6;
      transform-origin: 50% 50%;
      box-shadow:
        inset -2px -2px 4px #5d9dd822,
        0 0 5px #8fc8ff20;
    }

    .flower .center {
      position: absolute;
      width: 19%;
      height: 19%;
      top: 40.5%;
      left: 40.5%;
      background: #f8dba0;
      border-radius: 50%;
      border: 1px solid #f2c875;
    }

    /* FRASES */

    .garden-content {
      position: relative;
      z-index: 2;
      width: min(88%, 430px);
      padding: 30px 20px;
      text-align: center;
      pointer-events: none;
      margin-top: -5px;
    }

    .phrase-card {
      padding: 27px 17px;
      border-radius: 3px;
      background: #111827a8;
      border: 1px solid #b5d8ff18;
      box-shadow: 0 10px 40px #00000012;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      animation: appear 0.7s ease both;
    }

    .phrase-word {
      margin-bottom: 20px;
      font-size: clamp(19px, 5vw, 24px);
      letter-spacing: 5px;
      text-transform: uppercase;
      font-weight: normal;
      color: #a9d6ff;
    }

    .phrase-definition {
      font-size: clamp(16px, 4.2vw, 20px);
      font-style: italic;
      line-height: 1.85;
      color: #e0eaff;
    }

    .phrase-divider {
      width: 30px;
      height: 1px;
      margin: 23px auto 0;
      background: #7caedb;
    }

    .garden-hint {
      margin-top: 23px;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      line-height: 1.8;
      text-transform: uppercase;
      color: #a4bdd8;
      opacity: 0.9;
    }

    /* ANIMACIONES */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes breathe {
      0%, 100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes grow {
      from {
        opacity: 0;
        transform: scale(0.1) rotate(-15deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    /* ADAPTACIÓN A CELULARES */

    @media (max-height: 560px) {
      .intro-content {
        gap: 14px;
      }

      .envelope {
        height: 150px;
      }

      .garden-content {
        padding: 12px;
      }

      .phrase-card {
        padding: 16px 12px;
      }

      .phrase-word {
        margin-bottom: 10px;
      }

      .phrase-divider {
        margin-top: 12px;
      }

      .garden-hint {
        margin-top: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- PRIMERA PANTALLA: CARTA -->

  <section id="intro" class="screen">
    <div class="intro-content">

      <div
        class="envelope"
        id="envelope"
        role="button"
        tabindex="0"
        aria-label="Abrir la carta"
      >
        <div class="env-back"></div>

        <div class="letter">
          <span>Un pequeño jardín para ti.</span>
        </div>

        <div class="env-left"></div>
        <div class="env-right"></div>
        <div class="env-front"></div>
        <div class="env-flap"></div>

        <div class="seal" aria-hidden="true">✿</div>
      </div>

      <h1 class="intro-title">Para ti</h1>

      <p class="intro-subtitle">
        Hay algo bonito esperando por vos...
      </p>

      <p class="hint">Tocá la carta para abrirla</p>

    </div>
  </section>

  <!-- SEGUNDA PANTALLA: JARDÍN -->

  <section
    id="garden"
    class="screen hidden"
    aria-label="Jardín de flores celestes"
  >
    <div id="flower-layer"></div>

    <main class="garden-content">
      <div class="phrase-card" id="phrase-card" aria-live="polite">
        <h2 class="phrase-word" id="phrase-word">Belleza</h2>

        <p class="phrase-definition" id="phrase-definition">
          Cualidad de lo bello, que despierta admiración y deleite.
        </p>

        <div class="phrase-divider"></div>
      </div>

      <p class="garden-hint">
        Tocá la pantalla para hacer florecer el jardín
      </p>
    </main>
  </section>

  <script>
    const intro = document.getElementById("intro");
    const garden = document.getElementById("garden");
    const envelope = document.getElementById("envelope");
    const flowerLayer = document.getElementById("flower-layer");
    const phraseCard = document.getElementById("phrase-card");
    const phraseWord = document.getElementById("phrase-word");
    const phraseDefinition = document.getElementById("phrase-definition");

    let opened = false;
    let lastPhraseIndex = -1;

    const phrases = [
      {
        word: "Belleza",
        definition: "Cualidad de lo bello, que despierta admiración y deleite."

      {

      },
      {

        definition: "Sentimiento que nace al descubrir algo extraordinario."
      },
      {
        word: "Delicadeza",
        definition: "Cualidad de aquello que inspira ternura y cuidado."
      },
      {
        word: "Esplendor",
        definition: "Brillo y belleza que destacan de manera extraordinaria."
      },
      {
        word: "Armonía",
        definition: "Grata proporción y correspondencia entre las cosas."
      },
      {
        word: "Gracia",
        definition: "Cualidad que hace que algo resulte agradable y especial."
      },
      {
        word: "Maravilla",
        definition: "Aquello que causa admiración por su belleza extraordinaria."
      },
      {
        word: "Luz",
        definition: "Claridad que ilumina; aquello que vuelve todo más bello."
      },
      {
        word: "Única",
        definition: "Que no tiene semejante y resulta imposible de reemplazar."
      },
      {
        word: "Ternura",
        definition: "Sentimiento de cariño que inspira suavidad y dulzura."
      },
      {
        word: "Autenticidad",
        definition: "Cualidad de ser genuino, verdadero y fiel a uno mismo."
      },
      {
        word: "Adorable",
        definition: "Digno de cariño, afecto y admiración."
      },
      {
        word: "Fascinación",
        definition: "Atracción intensa que despierta algo extraordinario."
      },
      {
        word: "Belleza interior",
        definition: "Aquella que nace de la esencia y se refleja en los actos."
      },
      {
        word: "Encantadora",
        definition: "Que atrae por su dulzura, su gracia o su manera de ser."
      },
      {
        word: "Excepcional",
        definition: "Que se distingue de lo común por sus cualidades."
      },
      {
        word: "Inolvidable",
        definition: "Que por su importancia o belleza permanece en la memoria."
      },
      {
        word: "Esencia",
        definition: "Lo más puro y característico de alguien."
      },
      {
        word: "Poético",
        definition: "Que expresa belleza, emoción y sensibilidad."
      },
      {
        word: "Serenidad",
        definition: "Calma y armonía que transmiten paz."
      },
      {
        word: "Resplandecer",
        definition: "Brillar con luz propia."
      },
      {
        word: "Asombro",
        definition: "Admiración que nace ante algo extraordinario."
      },
      {
        word: "Especial",
        definition: "Que sobresale por una cualidad que lo hace diferente."
      },
      {
        word: "Apreciar",
        definition: "Reconocer el valor y la belleza de algo o alguien."
      },
      {
        word: "Sublime",
        definition: "Tan bello o extraordinario que despierta una emoción profunda."
      },
      {
        word: "Perfectamente imperfecta",
        definition: "La belleza de ser real, sin necesidad de ser perfecta."
      },
      {

        definition: "Que merece estima, respeto y admiración."
      },
      {

      },
      {

        definition: "Estado de grata satisfacción espiritual y física."
      },
      {

      },
      {

      },
      {

      {

      {

      {

      {

      },
      {

      },
      {

      },
      {

      },
      {
        word: "Encanto natural",
        definition: "La cualidad de cautivar sin siquiera intentarlo."
      },
      {

        definition: "Que transmite luz, alegría o una sensación de calidez."
      },
      {
        word: "Singular",
        definition: "Que destaca por ser particular y diferente de los demás."
      },
      {
        word: "Gratitud",
        definition: "Sentimiento de reconocimiento por el bien recibido."
      },
      {
        word: "Asombrosa",

      },
      {

      },
      {

        definition: "Sentimiento de afecto profundo que inspira cuidado y entrega."
      },
      {
        word: "Florecer juntos",
        definition: "Crecer compartiendo la belleza de cada nuevo día."
      },
      {
        word: "Tu sonrisa",
        definition: "Una pequeña expresión capaz de volver más bonito un día."
      },
      {
        word: "Tu mirada",
        definition: "Una forma silenciosa de decir mucho sin pronunciar palabras."
      },
      {

        definition: "Eso que te hace ser vos y nadie más."
      },
      {

      },
      {
        word: "Tu forma de ser",
        definition: "Una belleza que se descubre en los pequeños detalles."
      },
      {

        definition: "Aquello que conserva su valor sin necesitar aparentar."
      },
      {

      },
      {
        word: "Admiración sincera",
        definition: "Reconocer la belleza de alguien sin necesidad de exagerarla."
      },
      {
        word: "Gracias por existir",

      },
      {
        word: "Para vos",

      }
    ];

    // ABRIR LA CARTA

    function openLetter() {
      if (opened) return;
      opened = true;

      envelope.classList.add("open");

      setTimeout(() => {
        intro.classList.add("hidden");
        garden.classList.remove("hidden");

        addFlowers(11);
        changePhrase();
      }, 950);
    }

    envelope.addEventListener("click", openLetter);

    envelope.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openLetter();
      }
    });

    // CREAR FLORES

    function createFlower(x, y, size, delay = 0) {
      const flower = document.createElement("div");
      flower.className = "flower";

      flower.style.left = `${x}%`;
      flower.style.top = `${y}%`;
      flower.style.setProperty("--size", `${size}px`);
      flower.style.setProperty(
        "--lean",
        `${Math.random() * 30 - 15}deg`
      );
      flower.style.animationDelay = `${delay}ms`;

      const head = document.createElement("div");
      head.className = "head";

      for (let i = 0; i < 5; i++) {
        const petal = document.createElement("span");
        petal.className = "petal";
        petal.style.transform =
          `rotate(${i * 72}deg) translateY(-65%)`;
        head.appendChild(petal);
      }

      const center = document.createElement("span");
      center.className = "center";
      head.appendChild(center);

      const stem = document.createElement("div");
      stem.className = "stem";

      const leaf1 = document.createElement("div");
      leaf1.className = "leaf";

      const leaf2 = document.createElement("div");
      leaf2.className = "leaf second";

      flower.append(head, stem, leaf1, leaf2);
      flowerLayer.appendChild(flower);
    }

    // DISTRIBUIR FLORES POR EL JARDÍN

    function addFlowers(amount) {
      for (let i = 0; i < amount; i++) {
        const x = 3 + Math.random() * 91;
        const y = 4 + Math.random() * 87;
        const size = 22 + Math.random() * 25;

        createFlower(x, y, size, i * 55);
      }
    }

    // MOSTRAR UNA SOLA FRASE ALEATORIA

    function changePhrase() {
      let index;

      if (phrases.length <= 1) {
        index = 0;
      } else {
        do {
          index = Math.floor(Math.random() * phrases.length);
        } while (index === lastPhraseIndex);
      }

      lastPhraseIndex = index;

      phraseCard.style.animation = "none";
      void phraseCard.offsetWidth;

      phraseWord.textContent = phrases[index].word;
      phraseDefinition.textContent = phrases[index].definition;

      phraseCard.style.animation = "appear 0.7s ease both";
    }

    // CADA TOQUE AGREGA FLORES Y CAMBIA LA FRASE

    garden.addEventListener("pointerdown", (event) => {
      if (garden.classList.contains("hidden")) return;

      event.preventDefault();

      addFlowers(3 + Math.floor(Math.random() * 3));
      changePhrase();
    });
  </script>

</body>
</html>
